name: Daily HAB Comb

on:
  schedule:
    # 12:00 UTC = 6:00 AM Mountain Time, every day
    - cron: '0 12 * * *'
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write       # allows the bot to commit the updated events.json

jobs:
  comb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run the HAB comb
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python hab_comb.py

      - name: Commit new blooms (if any)
        run: |
          git config user.name  "hab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json LATEST_RUN.md
          git diff --staged --quiet || git commit -m "Auto HAB comb: $(date -u +%F)"
          git push
